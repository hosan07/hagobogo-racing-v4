:root { --bg: #20242B; --panel: #1B304D; --raised: #283F5F; --nav: #343C48; --primary: #00B2CF; --text: #FFFFFF; --muted: #BEC3CA; --dim: #76808E; }
:root:not([data-theme="light"]) { color-scheme: dark; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #20242B; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #14171C; color: var(--text); font-family: Pretendard, "Noto Sans KR", sans-serif; overflow: hidden; }
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

#panel { position: absolute; left: 560px; top: 205px; width: 640px; }
#label { font-size: 22px; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; }
#step { margin-top: 22px; font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
#title { margin-top: 26px; font-size: 52px; font-weight: 800; line-height: 72px; white-space: pre-line; }
#desc { margin-top: 30px; width: 560px; font-size: 28px; line-height: 44px; color: var(--muted); }
#bullet { margin-top: 26px; font-size: 26px; font-weight: 700; color: var(--primary); min-height: 40px; }
#track { position: absolute; left: 560px; top: 815px; width: 560px; height: 4px; background: var(--nav); border-radius: 2px; overflow: hidden; }
#bar { height: 100%; width: 0; background: var(--primary); }
#footer { position: absolute; left: 560px; top: 858px; font-size: 18px; color: var(--muted); }
#controls { position: absolute; right: 40px; top: 32px; display: flex; gap: 8px; align-items: center; z-index: 10; }
#controls button { height: 40px; min-width: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #343C48; background: #1B304D; color: #FFFFFF; font: 700 14px Pretendard, "Noto Sans KR", sans-serif; cursor: pointer; }
#controls button:hover { border-color: var(--primary); }
#controls button.on { background: var(--primary); border-color: var(--primary); }
#jump { position: absolute; left: 560px; top: 640px; width: 640px; display: none; flex-wrap: wrap; gap: 8px; }
#jump button { height: 36px; padding: 0 12px; border-radius: 32px; border: 1px solid #343C48; background: #1B304D; color: #BEC3CA; font: 600 14px Pretendard, "Noto Sans KR", sans-serif; cursor: pointer; }
#jump button:hover { color: #FFFFFF; border-color: var(--primary); }
body.play #jump { display: flex; }
body.play #track, body.play #bar { display: none; }
body.record #controls { display: none; }
body.play #bPrev, body.play #bPlay, body.play #bNext { display: none; }

"V4_R03_Transform": { m: "\n<helmet>\n<style>\nbody{margin:0}\na{color:#00B2CF}a:hover{color:#D2F2F8}\n@keyframes hbOut{0%,30%{opacity:1;transform:scale(1)}50%{opacity:0;transform:scale(0.6)}100%{opacity:0;transform:scale(0.6)}}\n@keyframes hbIn{0%,45%{opacity:0;transform:scale(0.4) rotate(-20deg)}65%{opacity:1;transform:scale(1.15) rotate(0)}75%,100%{opacity:1;transform:scale(1)}}\n@keyframes hbFlash{0%,38%{opacity:0;transform:scale(0.3)}50%{opacity:1;transform:scale(1.2)}70%,100%{opacity:0;transform:scale(1.6)}}\n@keyframes hbSpin{to{transform:rotate(360deg)}}\n.hb-out{animation:hbOut 3s ease-in-out infinite}\n.hb-in{animation:hbIn 3s ease-out infinite}\n.hb-flash{animation:hbFlash 3s ease-out infinite}\n.hb-spin{animation:hbSpin 6s linear infinite}\n</style>\n</helmet>\n<div style=\"width: 375px; height: 812px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 38%, #1B304D 0%, #20242B 70%); color: #FFFFFF; font-family: Pretendard, sans-serif; box-sizing: border-box; padding-top: 52px\">\n<p style=\"margin: 40px 24px 0; text-align: center; font-size: 13px; font-weight: 700; color: #00B2CF\">레이스 모드로 변신!</p>\n<p style=\"margin: 6px 24px 0; text-align: center; font-size: 24px; font-weight: 800\">보고가 번개가 됐어요</p>\n<div style=\"position: relative; width: 280px; height: 280px; margin: 40px auto 0\">\n<svg class=\"hb-spin\" width=\"280\" height=\"280\" viewBox=\"0 0 280 280\" style=\"position: absolute; inset: 0\" aria-hidden=\"true\"><circle cx=\"140\" cy=\"140\" r=\"128\" fill=\"none\" stroke=\"#00B2CF\" stroke-width=\"2\" stroke-dasharray=\"6 14\" opacity=\"0.6\"></circle><circle cx=\"140\" cy=\"140\" r=\"106\" fill=\"none\" stroke=\"#F5C04F\" stroke-width=\"1.5\" stroke-dasharray=\"2 10\" opacity=\"0.6\"></circle></svg>\n<div class=\"hb-flash\" style=\"position: absolute; left: 40px; top: 40px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #FFFFFF 0%, rgba(210,242,248,0.6) 40%, rgba(0,178,207,0) 70%) "V4_R04_Race": { m: "\n<helmet>\n<style>\nbody{margin:0}\na{color:#00B2CF}a:hover{color:#D2F2F8}\n@keyframes hbLane{to{background-position:0 22px}}\n@keyframes hbBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}\n.hb-lane{animation:hbLane .25s linear infinite}\n.hb-bob{animation:hbBob .5s ease-in-out infinite}\n</style>\n</helmet>\n<div style=\"width: 375px; height: 812px; position: relative; overflow: hidden; background: {{courseBg}}; color: #FFFFFF; font-family: Pretendard, sans-serif\">\n\n<div style=\"position: absolute; left: 0; top: 0; bottom: 0; width: 24px; border-radius: 0 20px 20px 0; background: {{wall}}\" aria-hidden=\"true\"></div>\n<div style=\"position: absolute; right: 0; top: 0; bottom: 0; width: 24px; border-radius: 20px 0 0 20px; background: {{wall}}\" aria-hidden=\"true\"></div>\n<sc-for list=\"{{lanes}}\" as=\"l\" hint-placeholder-count=\"3\"><div class=\"hb-lane\" style=\"{{l}}\" aria-hidden=\"true\"></div></sc-for>\n<sc-for list=\"{{bands}}\" as=\"b\" hint-placeholder-count=\"1\"><div style=\"{{b.style}}\"><span style=\"{{b.tag}}\">{{b.t}}</span></div></sc-for>\n<sc-for list=\"{{wbc}}\" as=\"o\" hint-placeholder-count=\"2\"><div style=\"{{o}}\" aria-hidden=\"true\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 50 50\"><path d=\"M25 3c9 0 13 6 18 3s9 7 4 12 3 12-3 16-8 11-19 8S9 47 4 40s-5-11 0-17S-1 9 9 6s7-3 16-3z\" fill=\"#EDE7FA\" stroke=\"#B9A8E6\" stroke-width=\"2\"></path><circle cx=\"19\" cy=\"22\" r=\"6\" fill=\"#B9A8E6\"></circle><circle cx=\"31\" cy=\"31\" r=\"4\" fill=\"#B9A8E6\"></circle></svg></div></sc-for>\n\n<sc-for list=\"{{racers}}\" as=\"r\" hint-placeholder-count=\"8\">\n<div style=\"{{r.pos}}\">\n<sc-if value=\"{{r.me}}\" hint-placeholder-val=\"{{false}}\"><span style=\"{{r.ring}}\" aria-hidden=\"true\"></span></sc-if>\n<img class=\"hb-bob\" src=\"{{r.src}}\" alt=\"{{r.name}}\" style=\"{{r.img}}\">\n<span style=\"{{r.tagStyle}}\">{{r.tag}}</span>\n</div>\n</sc-for>\n\n<div style=\"position: absolute; top: 48px; left: 12px; right: 12px; background: rgba(32,36,43,0.88); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px\">\n<span style=\"font-size: 30px; font-weight: 800; line-height: 1\">{{myRank}}<span style=\"font-size: 12px; color: #BEC3CA; font-weight: 700\">/8위</span></span>\n<span style=\"flex: 1; min-width: 0\"><span style=\"display: flex; align-items: center; gap: 6px\"><b style=\"font-size: 14px\">{{title}}</b></span><span style=\"display: block; font-size: 11px; color: #BEC3CA; margin-top: 2px\">{{sub}}</span></span>\n<span style=\"font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums\">{{clock}}</span>\n</div>\n\n<section aria-label=\"현재 순위\" style=\"position: absolute; top: 116px; left: 12px; width: 148px; background: rgba(32,36,43,0.82); border-radius: 14px; padding: 8px 8px 6px\">\n<b style=\"display: block; font-size: 11px; color: #BEC3CA; margin: 0 0 4px 2px\">현재 순위</b>\n<sc-for list=\"{{ranks}}\" as=\"k\" hint-placeholder-count=\"8\"><div style=\"{{k.style}}\"><b style=\"width: 12px; font-size: 11px\">{{k.no}}</b><img src=\"{{k.src}}\" alt=\"\" style=\"width: 16px; height: 16px\"><span style=\"flex: 1; min-width: 0; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{k.name}}</span><span style=\"font-size: 10px; color: #BEC3CA\">{{k.gap}}</span></div></sc-for>\n</section>\n\n<section aria-label=\"미니맵\" style=\"position: absolute; top: 116px; right: 12px; width: 190px; background: rgba(32,36,43,0.82); border-radius: 14px; padding: 8px 7px 6px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 2px\"><b style=\"font-size: 11px; color: #BEC3CA\">미니맵</b><span style=\"font-size: 10px; color: #C9B6E8\">{{zone}}</span></div>\n<div style=\"position: relative; width: 176px; height: 95px\">\n<svg width=\"176\" height=\"95\" viewBox=\"0 0 319 172\" role=\"img\" aria-label=\"휘어진 코스와 레이서 위치\">\n<path d=\"M14 156C50 156 60 130 82 118\" fill=\"none\" stroke=\"#2ECC8F\" stroke-width=\"14\" stroke-linecap=\"round\" opacity=\"0.55\"></path>\n<path d=\"M82 118C110 102 110 60 150 54\" fill=\"none\" stroke=\"#9A7BC6\" stroke-width=\"14\" stroke-linecap=\"round\" opacity=\"0.55\"></path>\n<path d=\"M150 54C190 48 200 100 226 86\" fill=\"none\" stroke=\"#C4CED7\" stroke-width=\"14\" stroke-linecap=\"round\" opacity=\"0.55\"></path>\n<path d=\"M226 86C252 72 252 32 290 26\" fill=\"none\" stroke=\"#00B2CF\" stroke-width=\"14\" stroke-linecap=\"round\" opacity=\"0.55\"></path>\n<circle cx=\"303\" cy=\"22\" r=\"16\" fill=\"#FBD0DD\" stroke=\"#F5C04F\" stroke-width=\"3\"></circle>\n</svg>\n<sc-for list=\"{{dots}}\" as=\"d\" hint-placeholder-count=\"8\"><span style=\"{{d}}\" aria-hidden=\"true\"></span></sc-for>\n</div>\n</section>\n\n<div style=\"position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; flex-direction: column; gap: 8px; align-items: center\">\n<span style=\"background: rgba(32,36,43,0.9); border: 1px solid #00B2CF; border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 700\">{{caption}}</span>\n<div style=\"display: flex; gap: 6px; align-items: center\">\n<span style=\"font-size: 11px; color: #BEC3CA\">자동 사용</span>\n<sc-for list=\"{{items}}\" as=\"i\" hint-placeholder-count=\"2\"><span style=\"{{i.style}}\">{{i.t}}</span></sc-for>\n</div>\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{false}}\"><a href=\"{{next}}\" style=\"display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 8px; background: #00B2CF; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 700\">{{cta}}</a></sc-if>\n</div>\n</div>\n", C: class extends DCLogic {

const ease = (p) => p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3);
let cur = null, prev = null, curScene = -1, shownBullet = null, bulletAt = 0;
function sceneAt(T) { let i = 0; while (i < N - 1 && T >= SC[i + 1].start) i++; return i; }
function enterScene(i) {
  if (prev) prev.destroy(); prev = cur; const s = SC[i];
  cur = mount(s.screen, { state: s.race ? { t: 0 } : {} }); cur.layer = document.createElement('div'); cur.layer.className = 'layer'; cur.layer.appendChild(cur.root); phone.insertBefore(cur.layer, tap);
  if (prev && prev.id === s.screen && s.race) { prev.destroy(); prev = null; }
  curScene = i; $('step').textContent = String(i + 1).padStart(2, '0') + ' / ' + N; $('title').textContent = s.title; $('desc').textContent = s.desc; shownBullet = null;
}
function frame(T) {
  T = Math.max(0, Math.min(TOTAL - 0.001, T)); const i = sceneAt(T); const s = SC[i]; const local = T - s.start;
  if (i !== curScene) enterScene(i);
  const p = ease(local / 0.5);
  if (prev) { cur.layer.style.transform = 'translateX(' + ((1 - p) * 100).toFixed(2) + '%)'; prev.layer.style.transform = 'translateX(' + (-p * 28).toFixed(2) + '%)'; prev.layer.style.opacity = String(1 - p * 0.6); if (p >= 1) { prev.destroy(); prev = null; cur.layer.style.transform = ''; } }
  else cur.layer.style.transform = '';
  if (s.race) { const t = local * s.speed; if (Math.abs((cur.comp.state.t || 0) - t) > 0.015) { cur.comp.state.t = t; cur.render(); } }
  for (const a of cur.holder.getAnimations({ subtree: true })) { try { a.pause(); a.currentTime = local * 1000; } catch (e) {} }
  const b = s.bullets ? s.bullets.filter((x) => x[0] <= local).pop()[1] : s.bullet; if (b !== shownBullet) { shownBullet = b; bulletAt = local; $('bullet').textContent = '• ' + b; }
  const tp = ease(local / 0.6); $('panel').style.opacity = String(tp); $('panel').style.transform = 'translateY(' + ((1 - tp) * 18).toFixed(1) + 'px)';
  const bp = ease((local - bulletAt) / 0.4); $('bullet').style.opacity = String(bp); $('bullet').style.transform = 'translateX(' + ((1 - bp) * -12).toFixed(1) + 'px)';
  $('bar').style.width = (100 * (i + local / s.dur) / N).toFixed(3) + '%';
  if (s.tap && local > s.dur - 0.75) { const q = (local - (s.dur - 0.75)) / 0.75; tap.style.left = s.tap[0] + 'px'; tap.style.top = s.tap[1] + 'px'; tap.style.opacity = String(q < 0.25 ? q * 4 : 1 - (q - 0.25) / 0.75); tap.style.transform = 'scale(' + (0.6 + q * 0.6).toFixed(3) + ')'; } else tap.style.opacity = '0';
}

/* ---- 자동 재생 ---- */
let playing = true, base = 0, t0 = performance.now(), raf = 0, mode = 'auto';
const nowT = () => playing ? base + (performance.now() - t0) / 1000 : base;
function loop() { if (mode !== 'auto') return; let T = nowT(); if (T >= TOTAL) { base = 0; t0 = performance.now(); T = 0; curScene = -1; } frame(T); raf = requestAnimationFrame(loop); }
function seekScene(i) { i = (i + N) % N; base = SC[i].start + 0.0001; t0 = performance.now(); curScene = -1; if (cur) { cur.destroy(); cur = null; } if (prev) { prev.destroy(); prev = null; } frame(base); }
$('bPlay').onclick = () => { if (mode !== 'auto') return; if (playing) { base = nowT(); playing = false; $('bPlay').textContent = '재생'; } else { t0 = performance.now(); playing = true; $('bPlay').textContent = '일시정지'; } };
$('bPrev').onclick = () => { if (mode === 'auto') seekScene(sceneAt(nowT()) - 1); };
$('bNext').onclick = () => { if (mode === 'auto') seekScene(sceneAt(nowT()) + 1); };

/* ---- 직접 플레이 ---- */
const JUMPS = [['등록', 'V4_Q01_Method'], ['내 영상에서 만나기', 'V4_Q04_ShootScan'], ['육성 메인', 'V4_H01_Home'], ['슬롯', 'V4_S01_Slots'], ['미니게임', 'V4_M01_MiniGames'], ['레이스', 'V4_R01_Select'], ['자동 주행', 'V4_R04_Race'], ['티어', 'V4_R06_Tier'], ['데일리 컵', 'V4_T01_Cup'], ['결승', 'V4_T03_Final']];
let playCur = null;
function showPlay(id, back) {
  const old = playCur; playCur = mount(id, { live: true, onLink: (to) => showPlay(to) }); const L = document.createElement('div'); L.className = 'layer'; L.appendChild(playCur.root); playCur.layer = L; phone.insertBefore(L, tap);
  if (old) { L.animate([{ transform: 'translateX(' + (back ? -30 : 100) + '%)' }, { transform: 'translateX(0)' }], { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' }); old.layer.animate([{ transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(' + (back ? 100 : -28) + '%)', opacity: 0.4 }], { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => old.destroy(); }
  const k = id.split('_')[1]; const c = CAPS[k] || ['', '']; $('step').textContent = '직접 플레이 · ' + k; $('title').textContent = c[0]; $('desc').textContent = c[1]; $('bullet').textContent = '• 화면 속 버튼을 눌러 이동해 보세요'; $('panel').style.opacity = '1'; $('panel').style.transform = ''; $('bullet').style.opacity = '1'; $('bullet').style.transform = '';
}
function setMode(m) {
  mode = m; document.body.classList.toggle('play', m === 'play'); $('bMode').classList.toggle('on', m === 'play'); $('bMode').textContent = m === 'play' ? '자동 재생' : '직접 플레이';
  [cur, prev, playCur].forEach((x) => x && x.destroy()); cur = prev = playCur = null; curScene = -1; tap.style.opacity = '0';
  if (m === 'play') { cancelAnimationFrame(raf); showPlay('V4_Q01_Method'); } else { base = 0; t0 = performance.now(); playing = true; $('bPlay').textContent = '일시정지'; loop(); }
}
$('bMode').onclick = () => setMode(mode === 'auto' ? 'play' : 'auto');
JUMPS.forEach(([n, id]) => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => showPlay(id); $('jump').appendChild(b); });

/* ---- 크기 맞춤 ---- */
function fit() { const k = Math.min(innerWidth / 1280, innerHeight / 960); $('stage').style.transform = 'scale(' + k + ')'; }
addEventListener('resize', fit); fit();

const fontsReady = Promise.all(['400', '500', '600', '700', '800'].map((w) => document.fonts.load(w + ' 24px Pretendard', '하고보고 레이싱 ABC 123'))).catch(() => {}).then(() => document.fonts.ready);
if (Q.has('record')) { document.body.classList.add('record'); mode = 'record'; window.__TOTAL = TOTAL; window.__frame = (T) => frame(T); fontsReady.then(() => { window.__ready = true; }); }
else fontsReady.then(() => setMode(Q.get('mode') === 'play' ? 'play' : 'auto'));
</script>
</body>
