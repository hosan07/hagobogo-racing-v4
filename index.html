"V4_G03_Frog": { m: "\n<helmet>\n<style>\nbody{margin:0}\na{color:#00B2CF}a:hover{color:#D2F2F8}\n@keyframes hbCharge{0%{stroke-dashoffset:226}80%,100%{stroke-dashoffset:70}}\n@keyframes hbSquash{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.84)}}\n@keyframes hbDrop{from{transform:translateY(-60px)}to{transform:translateY(40px)}}\n@keyframes hbGlow{0%,100%{opacity:.35}50%{opacity:.8}}\n.hb-charge{animation:hbCharge 1.4s ease-in infinite}\n.hb-squash{transform-origin:50% 100%;animation:hbSquash .8s ease-in-out infinite}\n.hb-drop{animation:hbDrop 1.6s linear infinite}\n.hb-glow{animation:hbGlow 1.4s ease-in-out infinite}\n</style>\n</helmet>\n<div style=\"width: 375px; height: 812px; position: relative; overflow: hidden; background: linear-gradient(180deg, #3A1A45 0%, #1E3157 45%, #16363A 85%, #0F2A2D 100%); color: #FFFFFF; font-family: Pretendard, sans-serif\">\n\n<div style=\"position: absolute; left: 137px; top: 104px; width: 100px; height: 100px\">\n<span class=\"hb-glow\" style=\"position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, rgba(251,208,221,0.7) 0%, rgba(251,208,221,0) 70%)\"></span>\n<span style=\"position: absolute; inset: 10px; border-radius: 50%; background: #FBD0DD; border: 3px solid #F5C04F\"></span>\n<span style=\"position: absolute; left: 30px; top: 26px; width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; opacity: 0.7\"></span>\n<span style=\"position: absolute; left: 50%; top: -6px; transform: translateX(-50%); background: #F5C04F; color: #20242B; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 32px; white-space: nowrap\">난자 도착 +50P</span>\n</div>\n\n<sc-for list=\"{{plats}}\" as=\"p\" hint-placeholder-count=\"7\"><div style=\"{{p.style}}\"><sc-if value=\"{{p.coin}}\" hint-placeholder-val=\"{{false}}\"><span style=\"position: absolute; left: 50%; top: -30px; margin-left: -12px; width: 24px; height: 24px; border-radius: 50%; background: #F5C04F; border: 2px solid #FFFFF bel=\"높이\" style=\"position: absolute; right: 8px; top: 150px; width: 8px; height: 440px; border-radius: 4px; background: rgba(255,255,255,0.12)\"><span style=\"{{barStyle}}\"></span><span style=\"position: absolute; left: -4px; top: -6px; width: 16px; height: 16px; border-radius: 50%; background: #FBD0DD; border: 2px solid #F5C04F; box-sizing: border-box\"></span></div>\n\n<div style=\"position: absolute; top: 52px; left: 16px; right: 16px; display: flex; align-items: center; gap: 8px\">\n<a href=\"V4_M01_MiniGames.dc.html\" aria-label=\"일시정지\" style=\"width: 44px; height: 44px; border-radius: 12px; background: rgba(32,36,43,0.7); color: #FFFFFF; display: flex; align-items: center; justify-content: center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"></rect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"></rect></svg></a>\n<span style=\"flex: 1; background: rgba(32,36,43,0.7); border-radius: 99px; padding: 8px 14px; font-size: 13px; font-weight: 600\">섬모 탑 · 난자까지 <b style=\"color: #F5C04F\">{{left}}칸</b></span>\n<span style=\"background: rgba(32,36,43,0.7); border-radius: 99px; padding: 6px 10px; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 4px; color: #00B2CF\"><img src=\"/_blob/00995cdc18901180226246bccd0a128f\" alt=\"\" style=\"width: 18px; height: 18px\">+{{pts}}</span>\n</div>\n\n<div style=\"position: absolute; left: 0; right: 0; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 22px\">\n<button type=\"button\" aria-label=\"왼쪽 자세\" aria-pressed=\"{{isL}}\" onClick=\"{{goL}}\" style=\"{{lStyle}}\">◀</button>\n<div style=\"position: relative; width: 92px; height: 92px\">\n<svg width=\"92\" height=\"92\" viewBox=\"0 0 92 92\" style=\"position: absolute; inset: 0; pointer-events: none\" aria-hidden=\"true\"><circle cx=\"46\" cy=\"46\" r=\"36\" fill=\"none\" stroke=\"#283F5F\" stroke-width=\"7\"></circle><circle class=\"{{chargeClass}}\" cx=\"46\" cy=\"46\" r=\"36\" fill=\"none\" stroke=\"#F5C04F\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-dasharray=\"226\" stroke-dashoffset=\"{{chargeOff}}\" transform=\"rotate(-90 46 46)\"></circle></svg>\n<button type=\"button\" aria-label=\"점프 · 짧게 1칸, 꾹 누르면 2칸\" onPointerDown=\"{{press}}\" onPointerUp=\"{{release}}\" style=\"position: absolute; left: 14px; top: 14px; width: 64px; height: 64px; border-radius: 50%; border: 0; background: #00B2CF; color: #FFFFFF; font: 800 15px Pretendard, sans-serif; box-shadow: 0 4px 0 #007E93; cursor: pointer; touch-action: none\">점프</button>\n</div>\n<button type=\"button\" aria-label=\"오른쪽 자세\" aria-pressed=\"{{isR}}\" onClick=\"{{goR}}\" style=\"{{rStyle}}\">▶</button>\n</div>\n<span style=\"background: rgba(32,36,43,0.8); border-radius: 12px; padding: 8px 14px; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.5\">◀ ▶ 로 방향을 정하고 점프 · <b style=\"color: #F5C04F\">짧게 1칸 · 꾹 눌러 2칸</b><br>떨어지는 백혈구에 맞으면 게임 끝!</span>\n</div>\n\n<sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"dialog\" aria-label=\"게임 결과\" style=\"{{cardStyle}}\">\n<b style=\"font-size: 22px\">{{doneTitle}}</b>\n<span style=\"font-size: 14px; color: #BEC3CA\">이번 판 <b style=\"color: #00B2CF\">+{{pts}}P</b></span>\n<div style=\"display: flex; gap: 8px; width: 100%; margin-top: 6px\">\n<a href=\"V4_M01_MiniGames.dc.html\" style=\"flex: 1; height: 46px; border-radius: 8px; background: #D2F2F8; color: #003665; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700\">미니게임</a>\n<button type=\"button\" onClick=\"{{restart}}\" style=\"flex: 1.3; height: 46px; border: 0; border-radius: 8px; background: #00B2CF; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer\">다시 하기</button>\n</div>\n</div>\n</sc-if>\n</div>\n", C: class extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
  }
  fresh() {
    return { run: false, over: false, win: false, why: '', row: 0, col: 1, dir: -1, pts: 18, got: {}, hold: 0, now: 0, jump: null,
      haz: [{ c: 2, y: 250, s: 40 }, { c: 0, y: 190, s: 26 }] };
  }
  componentWillUnmount() { clearInterval(this._iv); }
  get X() { return [72, 187, 302]; }
  get ROWS() { return [[548, [1]], [478, [0, 2]], [398, [1]], [318, [0, 2]], [238, [1]]]; }
  get COINS() { return { '1-0': 1, '3-2': 1, '4-1': 1 }; }
  pos(r, c) {
    const x = this.X[Math.max(0, Math.min(2, c))] + (c < 0 ? -90 : c > 2 ? 90 : 0);
    return [x - 25, (r < 5 ? this.ROWS[r][0] : 177) - 48];
  }
  begin() {
    if (this.state.run) return;
    this._n = 0;
    this.setState({ run: true, haz: [] });
    this._iv = setInterval(() => this.tick(), 33);
  }
  setDir(dir) {
    const s = this.state;
    if (s.over || s.win) return;
    this.setState({ dir });
    this.begin();
  }
  press() {
    const s = this.state;
    if (s.over || s.win || s.jump) return;
    this.begin();
    this.setState({ hold: Date.now(), now: Date.now() });
  }
  release() {
    const s = this.state;
    if (!s.hold || s.over || s.win) return this.setState({ hold: 0 });
    const long = Date.now() - s.hold >= 350;
    const nr = s.row + (long ? 2 : 1), nc = long ? s.col : s.col + s.dir;
    this.setState({ hold: 0, jump: { fr: this.pos(s.row, s.col), to: this.pos(nr, nc), nr, nc, k: 0 } });
  }
  restart() { clearInterval(this._iv); this.setState(this.fresh()); }
  end(patch) { clearInterval(this._iv); this.setState(patch); }
  tick() {
    const s = this.state;
    this._n++;
    let haz = s.haz.map((h) => ({ c: h.c, y: h.y + 5.5, s: h.s })).filter((h) => h.y < 840);
    if (this._n % 55 === 20) haz.push({ c: Math.floor(Math.random() * 3), y: -60, s: 40 });
    let { row, col, pts, jump } = s;
    const got = Object.assign({}, s.got);
    if (jump) {
      const k = jump.k + 1 / 9;
      if (k < 1) jump = Object.assign({}, jump, { k });
      else {
        const { nr, nc } = jump;
        jump = null;
        if (nr >= 5) {
          if (nc === 1) return this.end({ row: 5, col: 1, jump: null, haz, pts: pts + 50, win: true });
          return this.end({ row: nr, col: nc, jump: null, haz, over: true, why: '난자를 지나쳤어요' });
        }
        if (!this.ROWS[nr][1].includes(nc)) return this.end({ row: nr, col: nc, jump: null, haz, over: true, why: '발판을 놓쳤어요' });
        row = nr; col = nc;
        if (this.COINS[row + '-' + col] && !got[row + '-' + col]) { got[row + '-' + col] = 1; pts += 5; }
      }
    }
    if (!jump) {
      const [, top] = this.pos(row, col);
      if (haz.some((h) => h.c === col && h.y + h.s > top + 8 && h.y < top + 42)) return this.end({ row, col, haz, pts, got, over: true, why: '백혈구에 맞았어요' });
    }
    this.setState({ haz, row, col, pts, got, jump, now: Date.now() });
  }
  renderVals() {
    const s = this.state, X = this.X;
    const plats = [];
    this.ROWS.forEach(([y, cols], r) => cols.forEach((c) => plats.push({ coin: !!this.COINS[r + '-' + c] && !s.got[r + '-' + c],
      style: 'position: absolute; left: ' + (X[c] - 44) + 'px; top: ' + y + 'px; width: 88px; height: 16px; border-radius: 8px; background: #2ECC8F; box-shadow: inset 0 -6px 0 #1E9E6C' })));
    let [l, t] = this.pos(s.row, s.col);
    if (s.jump) {
      const k = s.jump.k;
      l = s.jump.fr[0] + (s.jump.to[0] - s.jump.fr[0]) * k;
      t = s.jump.fr[1] + (s.jump.to[1] - s.jump.fr[1]) * k - Math.sin(Math.PI * k) * 46;
    }
    const idle = !s.run, done = s.over || s.win;
    const frac = s.hold ? Math.min(1, (s.now - s.hold) / 350) : 0;
    const side = (on) => 'width: 60px; height: 60px; border-radius: 50%; border: 0; color: #FFFFFF; font: 800 22px Pretendard, sans-serif; cursor: pointer; ' + (on ? 'background: #F25353; box-shadow: 0 0 0 4px rgba(242,83,83,0.35), 0 4px 0 #B03333' : 'background: rgba(242,83,83,0.4); box-shadow: 0 4px 0 #7A2A2A');
    return {
      plats, idle, done, pts: s.pts, left: Math.max(0, 6 - s.row),
      haz: s.haz.map((h) => ({ s: h.s, cls: idle ? 'hb-drop' : '', style: 'position: absolute; left: ' + (X[h.c] - h.s / 2) + 'px; top: ' + h.y + 'px; width: ' + h.s + 'px; height: ' + h.s + 'px' + (idle && h.s < 40 ? '; animation-delay: -0.9s' : '') })),
      warn: idle ? ['position: absolute; left: 290px; top: 200px; width: 24px; height: 24px; border-radius: 50%; background: #F25353; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center']
        : s.haz.filter((h) => h.y < 110).map((h) => 'position: absolute; left: ' + (X[h.c] - 12) + 'px; top: 150px; width: 24px; height: 24px; border-radius: 50%; background: #F25353; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center'),
      frogClass: s.jump || done ? '' : 'hb-squash',
      frogStyle: 'position: absolute; left: ' + l + 'px; top: ' + t + 'px; width: 50px; height: 50px',
      frogImg: 'width: 50px; height: 50px; transform: ' + (s.dir < 0 ? 'rotate(-20deg)' : 'scaleX(-1) rotate(-20deg)'),
      arrow: s.dir < 0 ? '◀' : '▶',
      arrowStyle: 'position: absolute; left: ' + (s.dir < 0 ? l - 24 : l + 56) + 'px; top: ' + (t + 6) + 'px; color: #F25353; font-size: 18px; font-weight: 800; opacity: ' + (s.jump || done ? 0 : 1),
      barStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: ' + Math.min(100, 38 + s.row * 12) + '%; border-radius: 4px; background: #2ECC8F',
      isL: s.dir < 0, isR: s.dir > 0, lStyle: side(s.dir < 0), rStyle: side(s.dir > 0),
      chargeClass: idle ? 'hb-charge' : '', chargeOff: idle ? 110 : Math.round(226 - 156 * frac),
      doneTitle: s.win ? '난자 도착! +50P' : s.why,
      cardStyle: 'position: absolute; left: 32px; right: 32px; top: 300px; box-sizing: border-box; padding: 20px; border-radius: 18px; background: #1B304D; border: 2px solid ' + (s.win ? '#F5C04F' : '#F25353') + '; box-shadow: 0 12px 28px rgba(0,0,0,0.45); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center',
      goL: () => this.setDir(-1), goR: () => this.setDir(1),
      press: () => this.press(), release: () => this.release(),
      restart: () => this.restart()
    };
  }
} },
"V4_R01_Select": { m: "\n<helmet>\n<style>\nbody{margin:0}\na{color:#00B2CF}a:hover{color:#D2F2F8}\n</style>\n</helmet>\n<div style=\"width: 375px; height: 812px; position: relative; overflow: hidden; background: #20242B; color: #FFFFFF; font-family: Pretendard, sans-serif; box-sizing: border-box; padding-top: 52px\">\n<header style=\"display: flex; align-items: center; gap: 8px; padding: 0 24px; height: 32px\"><a href=\"V4_H01_Home.dc.html\" aria-label=\"뒤로가기\" style=\"color: #FFFFFF; display: flex\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"></path></svg></a><h1 style=\"margin: 0; font-size: 20px; font-weight: 700\">레이스하기</h1></header>\n<a href=\"V4_R02_MapIntro.dc.html\" style=\"margin: 14px 24px 0; display: flex; align-items: center; gap: 12px; background: #1B304D; border-radius: 16px; padding: 10px 12px; text-decoration: none; color: #FFFFFF\">\n<svg width=\"86\" height=\"52\" viewBox=\"0 0 319 190\" aria-hidden=\"true\"><path d=\"M20 170C70 168 60 120 100 116\" fill=\"none\" stroke=\"#9A7BC6\" stroke-width=\"16\" stroke-linecap=\"round\"></path><path d=\"M100 116C150 110 120 40 180 40C230 40 190 120 240 110\" fill=\"none\" stroke=\"#4A86C8\" stroke-width=\"16\" stroke-linecap=\"round\"></path><path d=\"M240 110C280 100 270 40 296 30\" fill=\"none\" stroke=\"#E0708F\" stroke-width=\"16\" stroke-linecap=\"round\"></path><circle cx=\"306\" cy=\"26\" r=\"18\" fill=\"#FBD0DD\"></circle></svg>\n<span style=\"flex: 1\"><span style=\"display: block; font-size: 12px; color: #BEC3CA\">오늘의 맵</span><b style=\"font-size: 16px\">백혈구 순찰로</b><span style=\"display: block; font-size: 12px; color: #C9B6E8\">집중이 높을수록 유리 · 내 집중 118</span></span>\n<span style=\"font-size: 18px; color: #BEC3CA\">›</span>\n</a>\n<a href=\"V4_R06_Tier.dc.html\" style=\"margin: 10px 24px 0; display: flex; align-items: center; gap: 10px; background: #1B304D; border: 1.5px solid #C4CED7; bor </span></sc-for>\n</div>\n<p style=\"margin: 8px 0 0; font-size: 11px; color: #BEC3CA; line-height: 1.5\">같은 티어 사용자들의 스탯을 불러와 달려요 · 높은 티어 상대를 이기면 1명당 +10 · 시즌이 끝나면 한 단계 아래에서 다시 시작하고 스탯은 그대로예요.</p>\n</section>\n</div>\n", C: class extends DCLogic {
  renderVals() {
    const list = [
      { name: '다이아', rp: '3,000 RP~', cap: 'Lv 30', perk: '컵 시드 배정 · 빛 오라', reward: '1,000P', fill: '#D2F2F8', stroke: '#00B2CF', state: 'lock' },

    return { tiers, rp };

    const zones = [['출발 물길', '#1D3A4A', '#2ECC8F'], ['좁은 관', '#2A2050', '#9A7BC6'], ['순찰대 구간', '#26303F', '#C4CED7'], ['마지막 직선', '#1E3157', '#00B2CF']];

"V4_T05_Shipping": { m: "\n<helmet>\n<style>\nbody{margin:0}\na{color:#00B2CF}a:hover{color:#D2F2F8}\ninput::placeholder{color:#76808E}\n</style>\n</helmet>\n<div style=\"width: 375px; height: 812px; position: relative; overflow: hidden; background: #20242B; color: #FFFFFF; font-family: Pretendard, sans-serif; box-sizing: border-box; padding-top: 52px\">\n<header style=\"display: flex; align-items: center; gap: 8px; padding: 0 24px; height: 32px\"><a href=\"V4_T04_Win.dc.html\" aria-label=\"뒤로가기\" style=\"color: #FFFFFF; display: flex\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"m15 5-7 7 7 7\"></path></svg></a><h1 style=\"margin: 0; flex: 1; font-size: 20px; font-weight: 700\">키트 배송 정보</h1><span style=\"font-size: 12px; color: #F5C04F; font-weight: 700\">7일 남음</span></header>\n\n<div style=\"margin: 12px 24px 0; display: flex; align-items: center; gap: 12px; background: #1B304D; border-radius: 12px; padding: 10px 12px\">\n<svg width=\"36\" height=\"36\" viewBox=\"0 0 32 32\" aria-hidden=\"true\"><rect x=\"4\" y=\"10\" width=\"24\" height=\"18\" rx=\"3\" fill=\"#D2F2F8\"></rect><path d=\"M4 14h24M16 10v18\" stroke=\"#00B2CF\" stroke-width=\"2\"></path><path d=\"M16 10c-3-6-9-4-6 0M16 10c3-6 9-4 6 0\" fill=\"none\" stroke=\"#00B2CF\" stroke-width=\"2\"></path></svg>\n<span style=\"flex: 1\"><b style=\"display: block; font-size: 14px\">하고보고 키트 1박스</b><span style=\"font-size: 12px; color: #BEC3CA\">10월 28일 데일리 컵 우승 보상 · 무료 배송</span></span>\n</div>\n\n<form aria-label=\"배송 정보\" style=\"margin: 14px 24px 0; display: flex; flex-direction: column; gap: 6px\">\n<label for=\"sh-name\" style=\"font-size: 13px; font-weight: 700\">받는 분</label>\n<input id=\"sh-name\" autocomplete=\"name\" placeholder=\"이름\" value=\"김하고\" style=\"height: 46px; box-sizing: border-box; border-radius: 8px; border: 1px solid #8F979F; background: #1B304D; color: #FFFFFF; padding: 0 14px; font: 500 15px P let acc = 0; SC.forEach((s) => { s.start = acc; acc += s.dur; }); const TOTAL = acc; const N = SC.length;
const $ = (id) => document.getElementById(id); const phone = $('phone'), tap = $('tap');
const ease = (p) => p < 0 ? 0 : p > 1 ? 1 : 1 - Math.pow(1 - p, 3);
let cur = null, prev = null, curScene = -1, shownBullet = null, bulletAt = 0;
function sceneAt(T) { let i = 0; while (i < N - 1 && T >= SC[i + 1].start) i++; return i; }
function enterScene(i) {
  if (prev) prev.destroy(); prev = cur; const s = SC[i];
  cur = mount(s.screen, { state: Object.assign(s.race ? { t: 0 } : {}, s.state || {}) }); cur.layer = document.createElement('div'); cur.layer.className = 'layer'; cur.layer.appendChild(cur.root); phone.insertBefore(cur.layer, tap);
  if (prev && prev.id === s.screen && s.race) { prev.destroy(); prev = null; }
  curScene = i; $('step').textContent = String(i + 1).padStart(2, '0') + ' / ' + N; $('title').textContent = s.title; $('desc').textContent = s.desc; shownBullet = null;
}
function frame(T) {
  T = Math.max(0, Math.min(TOTAL - 0.001, T)); const i = sceneAt(T); const s = SC[i]; const local = T - s.start;
  if (i !== curScene) enterScene(i);

  if (prev) { cur.layer.style.transform = 'translateX(' + ((1 - p) * 100).toFixed(2) + '%)'; prev.layer.style.transform = 'translateX(' + (-p * 28).toFixed(2) + '%)'; prev.layer.style.opacity = String(1 - p * 0.6); if (p >= 1) { prev.destroy(); prev = null; cur.layer.style.transform = ''; } }
  else cur.layer.style.transform = '';
  if (s.race) { const t = local * s.speed; if (Math.abs((cur.comp.state.t || 0) - t) > 0.015) { cur.comp.state.t = t; cur.render(); } }
  for (const a of cur.holder.getAnimations({ subtree: true })) { try { a.pause(); a.currentTime = local * 1000; } catch (e) {} }
  const b = s.bullets ? s.bullets.filter((x) => x[0] <= local).pop()[1] : s.bullet; if (b !== shownBullet) { shownBullet = b; bulletAt = local; $('bullet').textContent = '• ' + b; }
  const tp = ease(local / 0.6); $('panel').style.opacity = String(tp); $('panel').style.transform = 'translateY(' + ((1 - tp) * 18).toFixed(1) + 'px)';
  const bp = ease((local - bulletAt) / 0.4); $('bullet').style.opacity = String(bp); $('bullet').style.transform = 'translateX(' + ((1 - bp) * -12).toFixed(1) + 'px)';
  $('bar').style.width = (100 * (i + local / s.dur) / N).toFixed(3) + '%';
  if (s.tap && local > s.dur - 0.75) { const q = (local - (s.dur - 0.75)) / 0.75; tap.style.left = s.tap[0] + 'px'; tap.style.top = s.tap[1] + 'px'; tap.style.opacity = String(q < 0.25 ? q * 4 : 1 - (q - 0.25) / 0.75); tap.style.transform = 'scale(' + (0.6 + q * 0.6).toFixed(3) + ')'; } else tap.style.opacity = '0';
}

/* ---- 자동 재생 ---- */
let playing = true, base = 0, t0 = performance.now(), raf = 0, mode = 'auto';
const nowT = () => playing ? base + (performance.now() - t0) / 1000 : base;
function loop() { if (mode !== 'auto') return; let T = nowT(); if (T >= TOTAL) { base = 0; t0 = performance.now(); T = 0; curScene = -1; } frame(T); raf = requestAnimationFrame(loop); }
function seekScene(i) { i = (i + N) % N; base = SC[i].start + 0.0001; t0 = performance.now(); curScene = -1; if (cur) { cur.destroy(); cur = null; } if (prev) { prev.destroy(); prev = null; } frame(base); }
